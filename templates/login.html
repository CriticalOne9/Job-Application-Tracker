<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Job Application Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="container">
    <section class="panel" style="max-width: 460px; margin: 60px auto;">
      <h1 style="font-size: 2rem;">Welcome back</h1>
      <p class="subtitle">Log in to manage your applications.</p>

      {% if error %}
      <p style="color: #dc2626; font-weight: 600;">{{ error }}</p>
      {% endif %}

      <form action="{{ url_for('login') }}" method="POST" style="display: grid; gap: 14px; margin-top: 24px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Log in</button>
      </form>
    </section>
  </main>
</body>
</html>
